<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Valentine's Day</title>
    <style>
        body {
            /* Romantic purple gradient background */
            background: linear-gradient(to bottom right, #9b59b6, #8e44ad);
            color: white;
            text-align: center;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        h1 {
            margin-top: 50px;
            font-size: 3em;
        }
        #yes-button {
            padding: 20px 40px;
            font-size: 1.5em;
            border: none;
            border-radius: 10px;
            background-color: #e74c3c;
            color: white;
            cursor: pointer;
            transition: transform 0.2s;
        }
        #yes-button:hover {
            transform: scale(1.1);
        }
        .cat {
            width: 300px;
            height: auto;
            display: none;
        }
    </style>
</head>
<body>
    <h1>Happy Valentine's Day!</h1>
    <p>Please be my Valentine!</p>
    <button id="yes-button">Yes!</button>
    <img id="cat-gif" class="cat" src="https://media.giphy.com/media/JIX7tITA9jE8tW9T4m/giphy.gif" alt="Cat GIF">

    <script>
        const yesButton = document.getElementById('yes-button');
        const catGif = document.getElementById('cat-gif');

        yesButton.onclick = function() {
            yesButton.innerHTML = 'Yay!';
            catGif.style.display = 'block';
            celebrate();
        };

        function celebrate() {
            for (let i = 0; i < 100; i++) {
                createConfetti();
            }
        }

        function createConfetti() {
            const confetti = document.createElement('div');
            confetti.style.position = 'absolute';
            confetti.style.width = '10px';
            confetti.style.height = '10px';
            confetti.style.backgroundColor = 'hsl(' + Math.random() * 360 + ', 100%, 50%)';
            confetti.style.top = Math.random() * 100 + 'vh';
            confetti.style.left = Math.random() * 100 + 'vw';
            document.body.appendChild(confetti);
            setTimeout(() => {
                confetti.style.transform = 'translateY(100vh)';
                confetti.style.transition = 'transform 2s ease-out';
            }, 10);
            setTimeout(() => confetti.remove(), 2100);
        }
    </script>
</body>
</html>
