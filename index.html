<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Day</title>
    <style>
        body {
            background: linear-gradient(to right, #ff7e5f, #feb47b); /* romantic pink gradient */
            text-align: center;
            font-family: Arial, sans-serif;
        }
        img {
            width: 300px; /* Set a fixed width for GIFs */
        }
        .yes-button {
            font-size: 20px;
            transition: transform 0.2s;
        }
        .no-button {
            display: none; /* Hide the button that moves */
        }
    </style>
</head>
<body>

    <h1>Happy Valentine's Day!</h1>
    <img id="cat-gif" src="https://media.giphy.com/media/JIX8t1j0ZTN9S/giphy.gif" alt="Cat GIF" />
    
    <div>
        <button class="yes-button" id="yes-button">Yes!</button>
        <button class="no-button" id="no-button">No!</button>
    </div>
    
    <p id="message" style="display:none;">Please, please say yes!</p>

    <script>
        let noClickCount = 0;

        document.getElementById('yes-button').addEventListener('click', () => {
            alert("Yay! Thank you!");
        });

        document.getElementById('no-button').addEventListener('click', () => {
            noClickCount++;
            document.getElementById('yes-button').style.transform = 'scale(' + (1 + noClickCount * 0.1) + ')';
            document.getElementById('message').style.display = 'block';
        });
    </script>

</body>
</html>
