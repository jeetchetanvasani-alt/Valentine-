<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine Interactive Buttons</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        .button {
            padding: 15px 25px;
            border: none;
            border-radius: 5px;
            margin: 10px;
            cursor: pointer;
            z-index: 2;
            position: relative;
            font-size: 16px;
        }
        .yes {
            background-color: green;
            color: white;
        }
        .no {
            background-color: red;
            color: white;
        }
    </style>
</head>
<body>
    <h1>Do you want to be my Valentine?</h1>
    <button class="button yes">Yes</button>
    <button class="button no">No</button>
</body>
</html>
