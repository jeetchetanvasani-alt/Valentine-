<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Page</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
        }
        #messages {
            margin: 20px;
        }
        button {
            width: 100px;
            margin: 10px;
            padding: 10px;
            font-size: 16px;
        }
        #catImage {
            width: 300px;  /* Adjust based on desired image size */
        }
    </style>
</head>
<body>
    <h1>Happy Valentine's Day!</h1>
    <img id="catImage" src="smiling-cat.gif" alt="Smiling Cat">
    
    <div id="messages">
        <p id="beggingMessage">Please click "Yes"!</p>
    </div>
    
    <button id="yesButton">Yes</button>
    <button id="noButton">No</button>

    <script>
        const messages = [
            "Please click 'Yes'! ❤️",
            "It's really important to me! 😿",
            "Don't leave me hanging! 🥺",
            "Just one click! 🐱",
        ];
        let currentMessageIndex = 0;

        document.getElementById('noButton').addEventListener('click', () => {
            currentMessageIndex++;
            if (currentMessageIndex < messages.length) {
                document.getElementById('beggingMessage').innerText = messages[currentMessageIndex];
                document.getElementById('catImage').src = 'crying-cat.gif'; // Change to crying cat GIF
            } else {
                document.getElementById('beggingMessage').innerText = "Alright... 😢";
            }
        });

        document.getElementById('yesButton').addEventListener('click', () => {
            document.getElementById('beggingMessage').innerText = "Thank you! 💖";
            document.getElementById('catImage').src = 'smiling-cat.gif'; // Keep smiling cat GIF
        });
    </script>
</body>
</html>
